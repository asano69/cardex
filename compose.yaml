services:
  cardex:
    image: ghcr.io/asano69/cardex:latest
    container_name: cardex
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - cardex.env
    volumes:
      - ./data:/cardex/pb_data
        #- /etc/ssl/certs/root_ca.crt:/certs/root_ca.crt:ro # optional
    environment:
      - TZ=Etc/UTC
      #
      - CARDEX_SERVER_HOST=0.0.0.0
      - CARDEX_SERVER_PORT=3000
      - CARDEX_DATA_DIR=pb_data
      #
      #- INITIAL_ADMIN_EMAIL=admin@mail.internal # default
      #- INITIAL_ADMIN_PASSWORD=password # default
volumes:
  data:
