services:
  cardpot:
    image: ghcr.io/asano69/cardpot:latest
    container_name: cardpot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - cardpot.env
    volumes:
      - ./data:/cardpot/pb_data
        #- /etc/ssl/certs/root_ca.crt:/certs/root_ca.crt:ro # optional
    environment:
      - TZ=Etc/UTC
      #
      - CARDPOT_SERVER_HOST=0.0.0.0
      - CARDPOT_SERVER_PORT=3000
      - CARDPOT_DATA_DIR=pb_data
      #
      #- INITIAL_ADMIN_EMAIL=admin@mail.internal # default
      #- INITIAL_ADMIN_PASSWORD=password # default
volumes:
  data:
